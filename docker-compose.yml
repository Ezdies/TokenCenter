name: token-center

services:
  reverse-proxy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TOKEN_CENTER_PORT:-8080}:80"
    volumes:
      - ./infrastructure/reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      control-api:
        condition: service_healthy
      dashboard:
        condition: service_healthy
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 10s
      timeout: 3s
      retries: 5

  control-api:
    build:
      context: .
      dockerfile: apps/control-api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://token_center:${POSTGRES_PASSWORD:-local-postgres-password}@postgres:5432/gateway
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard-angular/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 10s
      timeout: 3s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:v1.101.0@sha256:d295634e09c648dcdb72c4cc2dd226f5fb87823a73e88cbbed6f205e4deb044b
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_DATABASE_URL: postgresql://token_center:${POSTGRES_PASSWORD:-local-postgres-password}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-development-only}
      PYTHONPATH: /app/token-center
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ./infrastructure/litellm/config.yaml:/app/config.yaml:ro
      - ./packages/policy-engine/src:/app/token-center:ro
    depends_on:
      mock-llm:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 20s

  mock-llm:
    image: ghcr.io/berriai/litellm:v1.101.0@sha256:d295634e09c648dcdb72c4cc2dd226f5fb87823a73e88cbbed6f205e4deb044b
    restart: unless-stopped
    entrypoint: ["python", "/mock/mock_server.py"]
    volumes:
      - ./apps/mock-llm/mock_server.py:/mock/mock_server.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 3s
      timeout: 2s
      retries: 10

  postgres:
    image: postgres:18.6-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-password}
      POSTGRES_USER: token_center
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U token_center -d gateway"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.1-alpine3.23
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  redis_data:
